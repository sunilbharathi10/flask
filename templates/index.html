<html>
    <body>
        <h2>USER LIST</h2>
        <table border="2px">
            <tr>
                <td>id</td>
                <td>name</td>
                <td>email</td>
                <td>password</td>
                <td>delete</td>
            </tr>
            {%for user in users%}
            <tr>
                <td>{{user.id}}</td>
                <td>{{user.name}}</td>
                <td>{{user.email}}</td>
                <td>{{user.password}}</td>
                <td>

                <a href="/delete/{{user.id}}" onclick="return confirmDelete()">delete</a>
                </td>
            
            </tr>
            {% endfor %} 

            <a href="/create">register</a>

        </table>
        <script>
function confirmDelete() {
    return confirm("Are you sure you want to delete this user?");
}
</script>
    </body>
</html>
